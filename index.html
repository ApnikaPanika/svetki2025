<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Merry Christmas</title>
<style>
/* ---------------- Body ---------------- */
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to bottom, #b8c9d8, #e6eef5);
    font-family: 'Georgia', serif;
}

/* ---------------- Card ---------------- */
.card {
    position: relative;
    background: #fffaf0;
    width: 360px;
    padding: 32px;
    text-align: center;
    border-radius: 18px;
    border: 4px solid #2f7d32;
    box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    z-index: 10;
}

h1 { color: #8b1a1a; margin: 12px 0; }
p { color: #333; font-size: 18px; line-height: 1.6; margin: 14px 0; }
.footer { margin-top: 22px; font-size: 16px; color: #2f7d32; font-style: italic; }

.tree {
    font-size: 64px;
    margin-bottom: 10px;
    animation: glow 2.5s ease-in-out infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 6px #4caf50; }
    to   { text-shadow: 0 0 16px #4caf50; }
}

/* ---------------- Snow ---------------- */
.snow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
}

.snowflake {
    position: absolute;
    top: -10px;
    color: #f5f7fa;
    opacity: 0.85;
    animation-name: fall, drift;
    animation-timing-function: linear, ease-in-out;
    animation-iteration-count: infinite, infinite;
}

.snowflake::before { content: "❄"; }

@keyframes fall { to { transform: translateY(110vh); } }
@keyframes drift { 0% { margin-left:0; } 50% { margin-left:20px; } 100% { margin-left:0; } }

/* Snowflake pattern for multiple elements */
.snowflake:nth-child(odd)  { font-size: 12px; animation-duration: 18s, 6s; }
.snowflake:nth-child(even) { font-size: 18px; animation-duration: 22s, 8s; }
.snowflake:nth-child(3n)   { left: 10%; animation-delay: -3s; }
.snowflake:nth-child(4n)   { left: 25%; animation-delay: -7s; }
.snowflake:nth-child(5n)   { left: 40%; animation-delay: -5s; }

/* ---------------- Button ---------------- */
button {
    background: #2f7d32;
    color: white;
    border: none;
    padding: 10px 18px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 20px;
}

button:hover { background: #1b4d1b; }

/* ---------------- Modal ---------------- */
.modal {
    display: none; /* Hidden by default */
    position: fixed;
    z-index: 20;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0,0,0,0.6);
}

.modal-content {
    background-color: #fffaf0;
    margin: 15% auto;
    padding: 30px;
    border: 4px solid #2f7d32;
    width: 300px;
    text-align: center;
    border-radius: 16px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    animation: modalFade 0.5s ease;
}

@keyframes modalFade {
    from { opacity: 0; transform: scale(0.9); }
    to   { opacity: 1; transform: scale(1); }
}

/* Close button */
.close {
    color: #8b1a1a;
    float: right;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
}

.close:hover { color: #b22222; }
</style>
</head>
<body>

<!-- ---------------- Snow ---------------- -->
<div class="snow">
  <!-- 20 snowflakes (duplicate as needed for more snow) -->
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
</div>

<!-- ---------------- Card ---------------- -->
<div class="card">
    <div class="tree">🎄</div>
    <h1>Merry Christmas</h1>
    <p>
        Wishing our family a season filled with<br>
        love, laughter, and warm memories.
    </p>
    <p>
        May your home be filled with joy,<br>
        peace, and happiness this Christmas.
    </p>
    <button id="openModal">Open Secret Present 🎁</button>
    <div class="footer">
        With love ❤️<br>
        — From our family
    </div>
</div>

<!-- ---------------- Modal ---------------- -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2>🎁 Surprise! 🎉</h2>
    <p>Wishing you an extra magical Christmas!</p>
  </div>
</div>

<script>
  // Get elements
  const modal = document.getElementById("modal");
  const btn = document.getElementById("openModal");
  const span = document.querySelector(".close");

  // Open modal
  btn.onclick = () => { modal.style.display = "block"; }

  // Close modal
  span.onclick = () => { modal.style.display = "none"; }

  // Click outside modal closes it
  window.onclick = (event) => {
    if(event.target == modal) { modal.style.display = "none"; }
  }
</script>

</body>
</html>
