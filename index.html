<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Merry Christmas</title>
<style>
/* ---------------- Body ---------------- */
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to bottom, #324353, #e6eef5); /* soft winter sky */
    font-family: 'Georgia', serif;
}

/* ---------------- Card ---------------- */
.card {
    background: #fffaf0;
    width: 360px;
    padding: 32px;
    text-align: center;
    border-radius: 18px;
    border: 4px solid #2f7d32;
    box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    animation: fadeIn 1.8s ease;
    z-index: 10;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.96); }
    to   { opacity: 1; transform: scale(1); }
}

/* ---------------- Tree ---------------- */
.tree {
    font-size: 64px;
    margin-bottom: 10px;
    animation: glow 2.5s ease-in-out infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 6px #4caf50; }
    to   { text-shadow: 0 0 16px #4caf50; }
}

h1 {
    color: #8b1a1a;
    margin: 12px 0;
}

p {
    color: #333;
    font-size: 18px;
    line-height: 1.6;
    margin: 14px 0;
}

.footer {
    margin-top: 22px;
    font-size: 16px;
    color: #2f7d32;
    font-style: italic;
}

/* ---------------- Snow Container ---------------- */
.snow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
}

/* ---------------- Snowflake ---------------- */
.snowflake {
    position: absolute;
    top: -10px;
    color: #f5f7fa;
    opacity: 0.85;
    animation-name: fall, drift;
    animation-timing-function: linear, ease-in-out;
    animation-iteration-count: infinite, infinite;
}

.snowflake::before {
    content: "❄";
}

/* ---------------- Snow Animations ---------------- */
@keyframes fall {
    to { transform: translateY(110vh); }
}

@keyframes drift {
    0%   { margin-left: 0; }
    50%  { margin-left: 20px; }
    100% { margin-left: 0; }
}

/* ---------------- Snow Randomization ---------------- */
.snowflake:nth-child(odd)  { font-size: 12px; animation-duration: 18s, 6s; }
.snowflake:nth-child(even) { font-size: 18px; animation-duration: 26s, 10s; }

.snowflake:nth-child(3n)   { left: 10%; }
.snowflake:nth-child(4n)   { left: 25%; }
.snowflake:nth-child(5n)   { left: 40%; }
.snowflake:nth-child(6n)   { left: 55%; }
.snowflake:nth-child(7n)   { left: 70%; }
.snowflake:nth-child(8n)   { left: 85%; }

.snowflake:nth-child(2n)   { animation-delay: -5s; }
.snowflake:nth-child(3n)   { animation-delay: -10s; }
.snowflake:nth-child(4n)   { animation-delay: -15s; }

</style>
</head>
<body>

<!-- ---------------- Snowflakes ---------------- -->
<div class="snow">
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
  <span class="snowflake"></span>
</div>

<!-- ---------------- Card ---------------- -->
<div class="card">
    <div class="tree">🎄</div>
    <h1>Merry Christmas</h1>
    <p>
        Wishing our family a season filled with<br>
        love, laughter, and warm memories.
    </p>
    <p>
        May your home be filled with joy,<br>
        peace, and happiness this Christmas.
    </p>
    <div class="footer">
        With love ❤️<br>
        — From our family
    </div>
</div>

</body>
</html>
